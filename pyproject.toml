[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "email-ghost"
version = "0.1.0"
description = "Local email testing sandbox for humans and coding agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "aiosmtpd>=1.4.6,<2", "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "playwright==1.56.0", "pillow>=11,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
ml = ["transformers>=4.48,<5", "torch>=2.6,<3", "accelerate>=1.3,<2", "scikit-learn>=1.6,<2"]
calibration = ["scikit-learn>=1.6,<2"]

[project.scripts]
email-ghost = "email_ghost.cli:main"

[tool.setuptools.package-data]
email_ghost = ["static/*"]

[tool.setuptools.data-files]
"share/email-ghost" = ["skills/email-ghost/SKILL.md"]
"share/email-ghost-spam" = ["skills/email-ghost-spam/SKILL.md"]
"share/email-ghost/guides" = ["docs/spam-testing.md", "docs/model-training.md", "docs/calibration.md", "docs/google-integrations.md", "docs/integration-contract.md"]

[tool.setuptools.packages.find]
include = ["email_ghost*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
