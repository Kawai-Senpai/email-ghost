services:
  sandbox:
    image: email-ghost:local
    build: .
    ports:
      - "127.0.0.1:${GHOST_HTTP_PORT:-8030}:8030"
      - "127.0.0.1:${GHOST_SMTP_PUBLISH_PORT:-1025}:1025"
    environment:
      GHOST_RSPAMD_URL: http://rspamd:11333
      GHOST_RSPAMD_CONTROLLER_URL: http://rspamd:11334
      GHOST_RSPAMD_PASSWORD: ghost-local-only
      GHOST_PUBLIC_SMTP_PORT: ${GHOST_SMTP_PUBLISH_PORT:-1025}
      GHOST_SCANNER_REVISION: ${GHOST_SCANNER_REVISION:-rspamd-3.14.1-v1}
      GHOST_API_TOKEN: ${GHOST_API_TOKEN:-}
    volumes:
      - ghost-data:/data
    shm_size: 512mb
    init: true
    restart: unless-stopped
    depends_on:
      rspamd:
        condition: service_healthy
  rspamd:
    image: rspamd/rspamd:3.14.1
    volumes:
      - ./config/rspamd/worker-normal.inc:/etc/rspamd/local.d/worker-normal.inc:ro
      - ./config/rspamd/worker-controller.inc:/etc/rspamd/local.d/worker-controller.inc:ro
      - ./config/rspamd/redis.conf:/etc/rspamd/local.d/redis.conf:ro
      - rspamd-data:/var/lib/rspamd
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rspamc", "-h", "localhost:11334", "-P", "ghost-local-only", "-E", "-j", "stat"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  ghost-data:
  rspamd-data:
  redis-data:
