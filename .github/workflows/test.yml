name: Sandbox checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock -e '.[test,calibration]'
      - run: python -m pytest -q
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: python scripts/smoke.py --require-scanner --screenshots --output reports/chromium.json
      - run: python scripts/smoke.py --require-scanner --screenshots --engine firefox --output reports/firefox.json
      - run: python scripts/smoke.py --require-scanner --screenshots --engine webkit --output reports/webkit.json
      - run: email-ghost test examples/suite.json --output reports/suite
      - if: always()
        run: docker compose logs --no-color > reports/compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-evidence
          path: reports/
      - if: always()
        run: docker compose down
